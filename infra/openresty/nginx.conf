user nobody;
worker_processes auto;
error_log /dev/stderr info;
pid /tmp/nginx.pid;
events { worker_connections 4096; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout combined;
    sendfile      on;
    keepalive_timeout 65;

    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    lua_shared_dict auto_ssl 20m;
    lua_shared_dict auto_ssl_settings 64k;
    lua_shared_dict auto_ssl_lock 1m;
    lua_shared_dict auto_ssl_challenge 1m;

    resolver 8.8.8.8 1.1.1.1 ipv6=off valid=30s;

    limit_req_zone $binary_remote_addr zone=shopper_api:10m rate=30r/s;

    init_by_lua_block {
        local allow = require "allow_domain"
        auto_ssl = require("resty.auto-ssl").new()
        auto_ssl:set("allow_domain", function(domain)
            return allow.check(domain)
        end)
        auto_ssl:set("storage_adapter", "file")
        auto_ssl:set("dir", os.getenv("AUTO_SSL_STORAGE_DIR") or "/var/openresty-auto-ssl")
        local email = os.getenv("LETSENCRYPT_EMAIL")
        if email and email ~= "" then
            auto_ssl:set("account_email", email)
        end
        if os.getenv("LETSENCRYPT_STAGING") == "1" then
            auto_ssl:set("ca", "https://acme-staging-v02.api.letsencrypt.org/directory")
        end
        auto_ssl:init()
    }

    init_worker_by_lua_block {
        auto_ssl:init_worker()
    }

    upstream shopper_api {
        server api:8000;
        keepalive 32;
    }

    upstream shopper_web {
        server web:80;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            content_by_lua_block {
                require("resty.auto-ssl").serve_challenge()
            }
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate_by_lua_block {
            require("resty.auto-ssl").ssl_certificate()
        }

        ssl_certificate     /etc/ssl/resty-auto-ssl-fallback.crt;
        ssl_certificate_key /etc/ssl/resty-auto-ssl-fallback.key;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /api/ {
            limit_req zone=shopper_api burst=60 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://shopper_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
        }

        location / {
            proxy_pass http://shopper_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
        }
    }
}
