name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shopper-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/shopper-web/package-lock.json
      - run: npm ci
      - run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml config --quiet

  docker-build-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/shopper-api:${{ github.sha }},${{ secrets.DOCKER_REGISTRY }}/shopper-api:latest
      - uses: docker/build-push-action@v5
        with:
          context: apps/shopper-web
          file: apps/shopper-web/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/shopper-web:${{ github.sha }},${{ secrets.DOCKER_REGISTRY }}/shopper-web:latest
      - uses: docker/build-push-action@v5
        with:
          context: infra/openresty
          file: infra/openresty/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/shopper-openresty:${{ github.sha }},${{ secrets.DOCKER_REGISTRY }}/shopper-openresty:latest
