<div class="min-h-screen bg-slate-50 text-slate-900">
  <header
    class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 bg-white px-4 py-3 shadow-sm"
  >
    <div class="flex flex-wrap items-center gap-4">
      <h1 class="text-lg font-semibold tracking-tight">{{ 'app.title' | transloco }}</h1>
      <nav class="flex gap-3 text-sm font-medium text-slate-600">
        <a routerLink="/" class="hover:text-indigo-600">{{ 'nav.home' | transloco }}</a>
        <a routerLink="/products" class="hover:text-indigo-600">{{ 'nav.products' | transloco }}</a>
        <a routerLink="/admin/tenants" class="hover:text-indigo-600">{{ 'nav.admin' | transloco }}</a>
      </nav>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-sm text-slate-600">{{ 'app.language' | transloco }}</span>
      <button
        type="button"
        class="rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-800 hover:bg-slate-50"
        (click)="setLang('en')"
      >
        {{ 'app.english' | transloco }}
      </button>
      <button
        type="button"
        class="rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-800 hover:bg-slate-50"
        (click)="setLang('bn')"
      >
        {{ 'app.bangla' | transloco }}
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-5xl p-4">
    <router-outlet />
  </main>
</div>
