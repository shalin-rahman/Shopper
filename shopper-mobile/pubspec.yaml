name: shopper_mobile
description: Shopper Mobile POS Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.7
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  mobile_scanner: ^3.5.6
  provider: ^6.1.1
  http: ^1.2.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  sqflite: ^2.3.0
  drift: ^2.15.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.18
  connectivity_plus: ^5.0.2
  cached_network_image: ^3.3.0
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.7
  sentry_flutter: ^7.16.0
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  flutter_svg: ^2.0.9
  url_launcher: ^6.2.2
  package_info_plus: ^9.0.1
  device_info_plus: ^9.1.1
  path: ^1.8.3
  get_it: ^7.6.4
  dartz: ^0.10.1
  rxdart: ^0.27.7
  blue_thermal_printer: any
  esc_pos_utils: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  drift_dev: ^2.15.0
  build_runner: ^2.4.7
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

flutter_intl:
  enabled: true